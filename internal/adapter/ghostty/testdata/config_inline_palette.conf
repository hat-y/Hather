# Sample Ghostty config with an inline palette and no theme selection.
# The inline palette block is UNMARKED, so Hather must treat it as a conflict.
font-size = 14
window-padding-x = 8
background = #1d222c
foreground = #85a1d6
cursor-color = #85a1d6
selection-background = #61afef
selection-foreground = #1d222c
palette = 0=#1d222c
palette = 1=#d37474
palette = 2=#8fc19b
palette = 3=#b3b37f
palette = 4=#61afef
palette = 5=#b686be
palette = 6=#6eadd7
palette = 7=#85a1d6
# bright colors 8..15 follow the same shape; real configs carry all 16.
